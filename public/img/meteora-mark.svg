<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 214">
  <!-- Meteora mark: three rock pillars drawn as stacked contour lines, the way the plugin's
       site model draws the terrain, with a source dot and two echo arcs returning from the
       tallest pillar. Contour green from the site model, shading to sit beside the other marks. -->
  <defs>
    <linearGradient id="mtRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f0c4"/>
      <stop offset=".55" stop-color="#6fcf8f"/>
      <stop offset="1" stop-color="#2f6b45"/>
    </linearGradient>
    <linearGradient id="mtEcho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb066" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#mtRock)" stroke-linecap="round" stroke-linejoin="round">
    <!-- left pillar -->
    <path d="M30 196V92c0-14 9-24 21-24s21 10 21 24v104" stroke-width="7"/>
    <path d="M40 196V100c0-9 5-15 11-15s11 6 11 15v96" stroke-width="3" opacity=".7"/>
    <!-- tall middle pillar -->
    <path d="M78 196V48c0-16 10-28 24-28s24 12 24 28v148" stroke-width="7"/>
    <path d="M89 196V56c0-10 6-18 13-18s13 8 13 18v140" stroke-width="3" opacity=".7"/>
    <!-- right pillar -->
    <path d="M132 196V112c0-12 8-20 18-20s18 8 18 20v84" stroke-width="7"/>
    <path d="M141 196V118c0-7 4-12 9-12s9 5 9 12v78" stroke-width="3" opacity=".7"/>
    <!-- ground -->
    <path d="M14 200H186" stroke-width="5"/>
  </g>
  <!-- the source, and the echoes coming back from the tall pillar -->
  <circle cx="22" cy="150" r="7" fill="#ff8a4c"/>
  <g fill="none" stroke="url(#mtEcho)" stroke-width="5" stroke-linecap="round">
    <path d="M40 128a46 46 0 0 1 30 -20"/>
    <path d="M36 112a66 66 0 0 1 36 -30" opacity=".6"/>
  </g>
</svg>
